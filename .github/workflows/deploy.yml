name: Deploy

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
    branches:
      - production

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment webhook
        run: |
          curl --fail --connect-timeout 10 "${{ secrets.DEPLOY_WEBHOOK_URL }}"
